  - doc_id: us-31cfr-1020-220
    citation: "31 CFR § 1020.220"
    title: "Customer identification programme (CIP)"
    jurisdiction: US
    regulator: FinCEN
    doc_type: regulation
    status: in_force
    effective_from: 2003-10-01
    source_url: "https://www.ecfr.gov/current/title-31/subtitle-B/chapter-X/part-1020/section-1020.220"
    tags: [cip, kyc, identity, verification, account-opening, penalties]
    obligations:
      - "Collect name, date of birth (individuals), address and identification number before opening an account."
      - "Verify identity within a reasonable time using documentary or non-documentary methods, or both."
      - "Retain verification records for five years after the account is closed."
    text: |
      Banks must implement a written CIP that is part of their AML programme. The programme must
      collect, at a minimum: name; date of birth for individuals; address; and an identification
      number (TIN for US persons, or one or more of taxpayer identification number, passport
      number and country of issuance, alien identification card number, or number and country of
      issuance of another government-issued document for non-US persons). The institution must
      verify identity within a reasonable time after account opening, using documentary methods,
      non-documentary methods, or both.

      Non-documentary verification must address the risk that a customer is fictitious or is
      presenting a false identity, and should include elements such as independent contact with
      the customer, comparison against consumer or business databases, and checking against
      government lists. Where verification fails, the institution must apply its CIP procedures:
      refuse to open the account, close it, place it on hold, or apply other risk-based conditions,
      and consider whether a SAR is required.

      Examination focus: risk-based adequacy of non-documentary verification for remote onboarding;
      treatment of discrepancies in address or name; performance of a sanctioned-country check at
      onboarding; and retention. Note the interaction with beneficial ownership
      (§ 1010.230) and with the separate CTA reporting rule (§ 1010.380) — the three are distinct
      obligations that are routinely confused.
    confidence_note: "Paraphrase of 31 CFR 1020.220."

  - doc_id: us-31cfr-1010-230
    citation: "31 CFR § 1010.230"
    title: "Beneficial ownership requirement for legal entity customers"
    jurisdiction: US
    regulator: FinCEN
    doc_type: regulation
    status: in_force
    effective_from: 2018-05-11
    source_url: "https://www.ecfr.gov/current/title-31/subtitle-B/chapter-X/part-1010/subpart-B/section-1010.230"
    tags: [beneficial-ownership, cdd, 25-percent, control-person, legal-entity]
    obligations:
      - "Identify each individual with 25% or more direct or indirect equity interest and one individual with significant control."
      - "Verify the identity of each beneficial owner using risk-based procedures."
      - "Update beneficial ownership information on a risk-based basis, at least when triggered."
    text: |
      Covered financial institutions must establish and maintain written procedures reasonably
      designed to identify and verify beneficial owners of legal entity customers at the time a
      new account is opened. A beneficial owner is (1) each individual who, directly or
      indirectly, owns 25 percent or more of the equity interests of the legal entity, and
      (2) one individual with significant responsibility to control, manage or direct the legal
      entity (for example a chief executive officer, chief financial officer, managing member,
      general partner, president, or other individual who regularly performs similar functions).
      Both prongs apply: the control person is required even where no individual reaches 25
      percent, and the certification form must be obtained.

      Verification may be documentary or non-documentary and must be risk-based. Identification
      may not be avoided by relying on the customer's certification alone. Where ownership is held
      through chains of entities, the institution must look through to natural persons, using
      ownership percentages to compute indirect holdings.

      Operational risks: percentages that do not add to 100; ownership attributed to another
      entity and left unresolved; control persons who are nominees; and beneficial ownership
      changes after onboarding that are never refreshed. Monitoring should flag accounts whose
      counterparties or signatories change without a corresponding beneficial-ownership update.
    confidence_note: "Paraphrase of the CDD rule; distinct from the CTA reporting rule at § 1010.380."

  - doc_id: us-31cfr-1010-380
    citation: "31 CFR § 1010.380"
    title: "Corporate Transparency Act — beneficial ownership information reporting"
    jurisdiction: US
    regulator: FinCEN
    doc_type: regulation
    status: amended
    effective_from: 2024-01-01
    source_url: "https://www.ecfr.gov/current/title-31/subtitle-B/chapter-X/part-1010/subpart-C/section-1010.380"
    tags: [cta, boi, beneficial-ownership, reporting-company, amendment, 2025]
    amended_by: ["FinCEN Interim Final Rule (March 2025) exempting domestic reporting companies"]
    obligations:
      - "Foreign reporting companies registered to do business in the US must report BOI; domestic entities are exempt under the March 2025 interim final rule."
      - "Institutions relying on BOI must confirm the scope in force, as it changed materially in 2025."
    text: |
      The Corporate Transparency Act requires certain entities ("reporting companies") to file
      beneficial ownership information with FinCEN, identifying each beneficial owner (25 percent
      or more ownership, or substantial control) and, for entities formed on or after 1 January
      2024, each company applicant. The original rule applied to both domestic and foreign
      reporting companies and took effect 1 January 2024, with a 90-day (later 30-day) filing
      window for new entities and a one-year window for existing entities.

      Amendment history — important for temporal analysis. Litigation in 2024 produced
      injunction, reinstatement and further appellate activity, and on 21 March 2025 FinCEN issued
      an interim final rule exempting domestic reporting companies and US persons from BOI
      reporting, while retaining the requirement for foreign reporting companies registered to do
      business in the United States. A further rule narrowed the definition of "substantial
      control" for foreign entities. Consequently, statements that "every LLC must file BOI" were
      correct for 2024 but are wrong for 2025 onward.

      Compliance implication: the CDD obligation at § 1010.230 is unaffected — institutions must
      still identify and verify beneficial owners at account opening. What changed is the separate
      obligation on the customer to self-report to FinCEN. Any internal policy or vendor rule that
      encodes a static CTA requirement must be versioned with effective dates, which is precisely
      why ANJALI's retrieval is temporal.
    confidence_note: "Reflects the March 2025 interim final rule; confirm subsequent final rules before relying."

  - doc_id: us-ffiec-edd-pep
    citation: "FFIEC BSA/AML Manual — Enhanced Due Diligence and PEPs"
    title: "Enhanced due diligence and politically exposed persons"
    jurisdiction: US
    regulator: FFIEC
    doc_type: guidance
    status: in_force
    effective_from: 2014-01-01
    source_url: "https://bsaaml.ffiec.gov/manual"
    tags: [edd, pep, high-risk, due-diligence, foreign-correspondent, private-banking]
    obligations:
      - "Apply EDD to higher-risk customers, including foreign PEPs, correspondent relationships and private banking accounts."
      - "Obtain senior management approval and document source of wealth and funds."
    text: |
      The FFIEC manual sets out risk-based expectations for enhanced due diligence. EDD applies
      to customers the institution's risk assessment classifies as higher risk, and is mandatory
      for certain categories: foreign financial institutions holding correspondent accounts,
      private banking accounts for non-US persons (31 CFR § 1010.620), and senior foreign
      political figures and their immediate family and close associates.

      Minimum EDD elements for PEPs: determine whether the customer or beneficial owner is a
      senior foreign political figure; obtain senior management approval to establish or continue
      the relationship; take reasonable measures to establish the source of wealth and source of
      funds; and conduct enhanced ongoing monitoring. For correspondent accounts, obtain
      information on the foreign institution's AML programme, ownership, and the purpose of the
      account, and conduct periodic refreshes.

      Documentation is the control. An EDD file that contains only a database screenshot does not
      demonstrate source of wealth. The file should show what was asked, what was answered, how
      the answer was corroborated, and who approved. ANJALI's risk narratives capture these
      elements and cite the corresponding provision so the file is self-documenting.
    confidence_note: "Synthesis of FFIEC manual expectations; not verbatim."

  - doc_id: us-31cfr-1010-410-e
    citation: "31 CFR § 1010.410(e)"
    title: "Recordkeeping for funds transfers of $3,000 or more"
    jurisdiction: US
    regulator: FinCEN
    doc_type: regulation
    status: in_force
    effective_from: 1995-05-01
    source_url: "https://www.ecfr.gov/current/title-31/subtitle-B/chapter-X/part-1010/subpart-D/section-1010.410"
    tags: [funds-transfer, recordkeeping, 3000, travel-rule, wire, transparency]
    obligations:
      - "Retain records of funds transfers of $3,000 or more: originator, beneficiary, amount, date, and payment instructions."
      - "Verify the identity of the person placing the transfer and retain the verification record."
    text: |
      Financial institutions must retain records for funds transfers of $3,000 or more, whether
      or not the transfer is completed. Records must include the name and address of the
      originator, the amount, the date of execution, the payment instructions received, the
      identity of the beneficiary's financial institution, and, to the extent received, the
      beneficiary's name, address and account number. Where the transfer is conducted by a
      non-account holder, the institution must verify identity and record the specific identifier
      used.

      Records must be retrievable by the originator's name and by the transfer's reference number.
      Retention is five years. The $3,000 threshold is a US recordkeeping figure; correspondent
      and travel-rule obligations have their own thresholds and scope, and the EU regime uses a
      different structure entirely — see the TFR 2023/1113 entry. Do not "harmonise" these
      thresholds in code: a single global constant is a recurring source of cross-border
      findings.
    confidence_note: "Paraphrase of 31 CFR 1010.410(e)."

  - doc_id: us-31cfr-1010-410-f
    citation: "31 CFR § 1010.410(f)"
    title: "Travel rule — recordkeeping and transmission for transmittals of funds"
    jurisdiction: US
    regulator: FinCEN
    doc_type: regulation
    status: in_force
    effective_from: 1996-05-28
    source_url: "https://www.ecfr.gov/current/title-31/subtitle-B/chapter-X/part-1010/subpart-D/section-1010.410"
    tags: [travel-rule, wire-transfer, 3000, crypto, cvc, originator, beneficiary, recordkeeping]
    obligations:
      - "For transmittals of $3,000 or more, record and pass on originator and beneficiary information to the next institution."
      - "Apply the rule to convertible virtual currency transmittals by money transmitters (from 30 June 2020, compliance deferred to 30 June 2022 for certain requirements)."
      - "Screen for incomplete or mismatched information and apply risk-based handling."
    text: |
      The "travel rule" requires that, for a transmittal of funds of $3,000 or more, the
      originating financial institution must record the originator's name, address, account
      number, and the amount and date, and must include the same information with the transfer so
      it travels to the receiving institution; the receiving institution must retain the
      information it receives. Non-transmitting intermediaries must retain records and, where
      information is missing, take reasonable steps to obtain it. Where a transmittal is
      $3,000 or more, the institution must also verify the identity of the person initiating the
      transmittal.

      Application to virtual currency: FinCEN extended § 1010.410(f) to transmittals of
      convertible virtual currency by money transmitters, effective 30 June 2020, with a deferral
      until 30 June 2022 for the transmission requirement in the CVC context. A transmitter must
      therefore collect and send originator and beneficiary information for CVC transfers above
      the threshold, including where the counterparty is an unhosted wallet (with risk-based
      handling and recordkeeping).

      Comparison note: the US threshold is $3,000 and applies to transmittals by covered
      institutions. The EU TFR 2023/1113 applies to crypto-asset transfers with no de-minimis
      threshold and requires verification of self-hosted-wallet control above €1,000, and the
      FATF Recommendation 16 expects a $1,000/USD-EUR equivalent threshold as a baseline. A
      single platform serving all three markets must apply the strictest applicable rule per
      corridor and be able to evidence why.
    confidence_note: "Paraphrase; CVC applicability dates should be confirmed against FinCEN's 2019 guidance and the 2020/2022 deferrals."
